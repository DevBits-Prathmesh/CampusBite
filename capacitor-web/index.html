<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CampusBite</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #1e3932;
        color: #f2f0eb;
        font-family: "Nunito Sans", system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(242, 240, 235, 0.72);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CampusBite</h1>
      <p>
        This shell loads the canteen app from its server. Set
        <code>CAPACITOR_SERVER_URL</code> in <code>.env</code>, then run
        <code>npx cap sync android</code>.
      </p>
    </main>
  </body>
</html>
